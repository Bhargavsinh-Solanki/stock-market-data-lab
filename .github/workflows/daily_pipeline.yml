name: daily-pipeline

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC — after US market close
    - cron: "0 12 * * 0"      # Sunday 12:00 UTC — retrain + weekly predictions
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/processed
          key: duckdb-${{ github.run_id }}
          restore-keys: duckdb-

      - name: Run tests
        run: pytest -q

      - name: Daily ingestion + features
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          python scripts/run_daily_ingestion.py
          python scripts/run_feature_build.py

      - name: Weekly retrain + predictions (Sundays)
        if: github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/train_models.py
          python scripts/generate_weekly_predictions.py
