[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-political-trades-forecast"
version = "0.1.0"
description = "Legally compliant political-trading disclosure + market data platform with ML/neural next-week stock forecasts (research signals only, not investment advice)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "duckdb>=0.10",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "yfinance>=0.2.37",
    "pdfplumber>=0.11",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "joblib>=1.3",
    "streamlit>=1.32",
    "plotly>=5.20",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "shap>=0.45", "pandera>=0.18"]
neural = ["torch>=2.2", "neuralforecast>=1.7"]
tracking = ["mlflow>=2.11"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
