services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: streamlit run src/dashboard/app.py --server.address=0.0.0.0

  # Nightly ingestion + features + weekly predictions (simple cron-in-container).
  scheduler:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      sh -c "echo '30 22 * * 1-5 cd /app && python scripts/run_daily_ingestion.py && python scripts/run_feature_build.py >> /app/data/cron.log 2>&1
      0 12 * * 0 cd /app && python scripts/train_models.py && python scripts/generate_weekly_predictions.py >> /app/data/cron.log 2>&1' | crontab - && crond -f"

  # Optional PostgreSQL for post-MVP scale-out (DuckDB is the default store).
